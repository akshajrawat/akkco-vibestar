name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Unit tests
            script: test
          - name: Integration tests
            script: test:integration
          - name: PTY tests
            script: test:tui
          - name: Security tests
            script: test:security
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.x
          cache: npm
      - name: Install sandbox and native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap build-essential python3
      - name: Install dependencies
        run: npm ci
      - name: Run suite
        run: npm run ${{ matrix.script }}
