name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Linux checks and tests
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install sandbox and native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap build-essential python3

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: |
          npm run format:check
          npm exec -- prettier --check .github/workflows/ci.yml docs/PREMIUM-UX-GIT-FINALIZATION.md docs/VERIFICATION.md docs/PR-REPAIR-SYSTEM.md

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and regression tests
        run: npm test -- --maxWorkers=2

      - name: Integration tests
        run: npm run test:integration

      - name: PTY tests
        run: npm run test:tui

      - name: Production build
        run: npm run build
