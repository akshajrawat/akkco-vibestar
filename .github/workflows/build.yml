name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"

jobs:
  production:
    name: Production build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.x
          cache: npm
      - name: Install sandbox and native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap build-essential python3
      - name: Install dependencies
        run: npm ci
      - name: Build renderer, Electron and execution core
        run: npm run build
